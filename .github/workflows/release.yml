name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $dir = "AlfoPlus-Configurator-$version-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/alfoplus-configurator.exe $dir/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir-portable.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *-portable.zip
            target/x86_64-pc-windows-msvc/release/alfoplus-configurator.exe

